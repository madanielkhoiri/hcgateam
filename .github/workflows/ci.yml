name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend — typecheck, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy — cukup untuk "prisma generate" & unit test (tidak perlu koneksi
      # DB nyata; tidak ada test yang benar-benar connect ke Postgres).
      DATABASE_URL: postgresql://user:pass@localhost:5432/db_dummy
      JWT_SECRET: ci-dummy-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run tests
        run: npx jest --ci

      - name: Build (nest build) — pastikan benar-benar bisa dikompilasi untuk produksi
        run: npx nest build

      - name: Audit dependency vulnerabilities (informational)
        # Non-blocking: prisma CLI (devDependency, ditarik lagi lewat @prisma/client)
        # membawa deepmerge-ts versi rentan yang cuma dipakai di alur "prisma migrate/
        # generate" saat development — tidak pernah dijalankan oleh aplikasi produksi,
        # jadi sengaja tidak di-fix (fix-nya butuh downgrade prisma, regresi besar).
        # Step ini tetap jalan supaya kerentanan BARU tetap kelihatan di log CI.
        run: npm audit --audit-level=high || true

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (gagal hanya kalau ada error baru — lihat known-typescript-issues.txt)
        run: npm run typecheck:ci

      - name: Unit test (Vitest)
        run: npm test

      - name: Build (next build) — tsc --noEmit tidak menangkap semua bug produksi
        # Contoh nyata: bug useSearchParams() tanpa <Suspense> yang bikin build
        # produksi gagal total di seluruh /civil/project/**, baru ketahuan saat
        # next build dijalankan penuh — tsc --noEmit saja lolos mulus.
        run: npm run build

      - name: Audit dependency vulnerabilities (informational)
        run: npm audit --audit-level=high || true
